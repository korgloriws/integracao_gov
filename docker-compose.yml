services:
  integracao-gov:
    build: .
    image: integracao-gov
    container_name: integracao-gov
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8000"
      AWS_CACHE_INDEX: /app/data/aws_cache_index.json
      # Dentro do container sempre /mnt/sefaz (montado do host abaixo)
      SEFAZ_SHARE_ROOT: /mnt/sefaz
    ports:
      - "${APP_PORT:-3080}:8000"
    volumes:
      # JSONs gerados aparecem na pasta do projeto no Windows
      - ./saida_pacotes:/app/saida_pacotes
      - ./data:/app/data
      # Compartilhamento SEFAZ: no Windows mapeie Z: com scripts/montar-share-sefaz.ps1
      # e defina SEFAZ_SHARE_HOST_PATH=Z:/ no .env (Docker Desktop precisa compartilhar a unidade Z:)
      - ${SEFAZ_SHARE_HOST_PATH:-Z:/}:/mnt/sefaz:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
