services:
  integracao-gov:
    build: .
    image: integracao-gov
    container_name: integracao-gov
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8000"
      AWS_CACHE_INDEX: /app/data/aws_cache_index.json
      SEFAZ_SHARE_ROOT: ${SEFAZ_SHARE_ROOT:-/mnt/sefaz}
    ports:
      - "${APP_PORT:-3080}:8000"
    volumes:
      - ./saida_pacotes:/app/saida_pacotes
      - ./data:/app/data
      # Monte o compartilhamento da SEFAZ no host (CIFS/VPN) e descomente:
      # - /mnt/sefaz:/mnt/sefaz:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
